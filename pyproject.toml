[project]
name = "cms-pipeline"
version = "0.1.0"
description = "Ingest and model CMS hospital-quality data (readmissions, patient experience)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "dbt-core>=1.8,<2",
    "dbt-duckdb>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
